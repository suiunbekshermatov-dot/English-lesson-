<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Placement & Schedule | IT & Business College AIU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
      --badge-shift1-bg: #eff6ff;
      --badge-shift1-text: #1d4ed8;
      --badge-shift1-border: #bfdbfe;
      
      --badge-shift2-bg: #fffbeb;
      --badge-shift2-text: #b45309;
      --badge-shift2-border: #fde68a;

      --badge-shift3-bg: #f5f3ff;
      --badge-shift3-text: #6d28d9;
      --badge-shift3-border: #ddd6fe;

      --room-bg: #ecfdf5;
      --room-text: #047857;
      --room-border: #a7f3d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0b1329 0%, #1e293b 300px, #f1f5f9 300px, #f1f5f9 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .hero-header {
      text-align: center;
      margin-bottom: 24px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      width: 90px;
      height: 90px;
      background: #ffffff;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), 0 0 0 3px rgba(255, 255, 255, 0.2);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .logo-container:hover {
      transform: scale(1.04);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #e2e8f0;
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
    }

    h1.title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 6px;
      color: #ffffff;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 400;
    }

    .search-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }

    .input-wrapper {
      margin-bottom: 18px;
    }

    .input-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box svg {
      position: absolute;
      left: 16px;
      width: 20px;
      height: 20px;
      color: #94a3b8;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px 16px 15px 48px;
      font-size: 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #f8fafc;
      color: #0f172a;
      font-weight: 500;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.45);
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
    }

    .schedule-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed #e2e8f0;
    }

    .shift-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 10px;
      font-size: 12px;
    }

    .shift-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .shift-dot.blue { background: #2563eb; }
    .shift-dot.amber { background: #d97706; }
    .shift-dot.purple { background: #7c3aed; }

    .shift-box strong {
      display: block;
      color: #0f172a;
      font-weight: 700;
      font-size: 13px;
    }

    .shift-box span {
      color: #64748b;
      font-size: 11px;
      white-space: nowrap;
    }

    .result-container {
      margin-top: 24px;
      display: none;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, #2563eb 0%, #1e3a8a 100%);
    }

    .card-header-fio {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .student-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #2563eb;
      margin-bottom: 4px;
    }

    .student-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .info-row .label {
      color: #64748b;
      font-weight: 500;
    }

    .info-row .value {
      font-weight: 700;
      color: #0f172a;
      text-align: right;
    }

    .room-pill {
      display: inline-block;
      padding: 5px 13px;
      background: var(--room-bg);
      color: var(--room-text);
      border: 1px solid var(--room-border);
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .time-pill {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .time-pill.shift-1 {
      background: var(--badge-shift1-bg);
      color: var(--badge-shift1-text);
      border: 1px solid var(--badge-shift1-border);
    }

    .time-pill.shift-2 {
      background: var(--badge-shift2-bg);
      color: var(--badge-shift2-text);
      border: 1px solid var(--badge-shift2-border);
    }

    .time-pill.shift-3 {
      background: var(--badge-shift3-bg);
      color: var(--badge-shift3-text);
      border: 1px solid var(--badge-shift3-border);
    }

    .not-found-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .not-found-card h3 {
      color: #92400e;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .not-found-card p {
      color: #b45309;
      font-size: 13px;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

      </div>

      <div id="resultArea" class="result-container"></div>
    </main>

    <footer>
      IT & Business College • Корпус C • Бишкек

  </div>

    async function tryUpdateFromExcel() {
      try {
        const res = await fetch('students.xlsx?t=' + Date.now());
        if (!res.ok) return;
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);

        if (rows && rows.length > 0) {
          students = rows.map(r => ({
            fio: (r['ФИО студента'] || r['ФИО'] || r['фио'] || `${r['Фамилия'] || ''} ${r['Имя'] || ''}`).trim(),
            teacher: (r['Фамилия и Имя учителя'] || r['Учитель'] || r['учитель'] || 'Уточняется').toString().trim(),
            room: (r['Кабинет'] || r['кабинет'] || 'Уточняется').toString().trim(),
            time: (r['Время начала занятия'] || r['Время'] || r['время'] || '08:30').toString().trim()
          })).filter(item => item.fio.length > 1);

          fillSuggestions();
        }
      } catch (e) {}
    }

    tryUpdateFromExcel();

    function normalizeText(text) {
      return text.toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
    }

    function search() {
      const q = normalizeText(input.value);
      if (!q) return;

      const matched = students.filter(s => normalizeText(s.fio).includes(q));
      resultArea.style.display = 'block';

      if (matched.length === 0) {
        resultArea.innerHTML = `
          <div class="not-found-card">
            <h3>Студент не найден</h3>
            <p>Проверьте правильность написания фамилии или имени, либо обратитесь на кафедру.</p>
          </div>
        `;
        return;
      }

      let html = '';
      matched.forEach(s => {
        let pillClass = 'shift-1';
        let shiftLabel = '1-я смена (08:30)';

        if (s.time.includes('10')) {
          pillClass = 'shift-2';
          shiftLabel = '1-я смена (10:00)';
        } else if (s.time.includes('13')) {
          pillClass = 'shift-3';
          shiftLabel = '2-я смена (13:00)';
        }

        html += `
          <div class="result-card">
            <div class="card-header-fio">
              <div class="student-tag">Студент</div>
              <div class="student-title">${s.fio}</div>
            </div>

            <div class="info-grid">
              <div class="info-row">
                <span class="label">Преподаватель:</span>
                <span class="value" style="color: #1e3a8a; font-size: 15px;">${s.teacher}</span>
              </div>


            </div>
          </div>
        `;
      });

      resultArea.innerHTML = html;
    }

    button.addEventListener("click", search);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") search();
    });
  </script>
</body>
</html>
